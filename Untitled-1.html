    <script>
        // Dummy Plant Data
        const plants = [
            { name: "Aloe Vera", light: "low" },
            { name: "Spider Plant", light: "medium" },
            { name: "Cactus", light: "high" },
            { name: "Ficus", light: "medium" },
            { name: "Succulent", light: "high" },
            { name: "Pothos", light: "low" },
            { name: "Snake plant", light: "low" },
            { name: "ZZ Plant (Zamioculcas zamiifolia)", light: "medium" },
            { name: "Cast Iron Plant (Aspidistra elatior)", light: "low" },
            { name: "Chinese Evergreen (Aglaonema)", light: "low" },
            { name: "Dracaena", light: "low" },
            { name: "Fiddle Leaf Fig (Ficus lyrata)", light: "high" },
            { name: "Bamboo Palm (Chamaedorea seifrizii)", light: "high" },
            { name: "Pilea (Pilea peperomioides)", light: "high" },
            { name: "String of Pearls ", light: "high" },
            { name: "Rubber plant(Ficus elastica) ", light: "high" },
            { name: "Basil", light: "high" },
            { name: "Cilantro", light: "medium" },
            { name: "Rosemary", light: "high" },
            { name: "Thyme", light: "high" },
            { name: "Oregano", light: "high" },
            { name: "Mint", light: "medium" },
            { name: "Tamatoes", light: "high" },
            { name: "Peppers", light: "high" },
            { name: "Carrots", light: "high" },
            { name: "Lettuce", light: "medium" },
            { name: "Spinach", light: "medium" },
            { name: "Cucumbers", light: "high" },
            { name: "Radishes", light: "medium" },
            { name: "Marigolds", light: "high" },
            { name: "Roses", light: "high" },
            { name: "Jasmine", light: "high" },
            { name: "Hibiscus", light: "high" },
            
            
        ];

        // Function to display the plants
        function displayPlants(plantList) {
            const plantContainer = document.getElementById("plantList");
            plantContainer.innerHTML = '';
            plantList.forEach(plant => {
                const plantElement = document.createElement('div');
                plantElement.className = 'plant';
                plantElement.innerHTML = `<h3>${plant.name}</h3><p>Light: ${plant.light}</p>`;
                plantContainer.appendChild(plantElement);
            });
        }
        
        // Search function
        function searchPlants() {
            const searchQuery = document.getElementById("searchBar").value.toLowerCase();
            const filteredPlants = plants.filter(plant => plant.name.toLowerCase().includes(searchQuery));
            displayPlants(filteredPlants);
        }

        // Lighting filter function
        function filterPlants() {
            const lightFilter = document.getElementById("lightRequirement").value;
            const filteredPlants = plants.filter(plant => lightFilter === "all" || plant.light === lightFilter);
            displayPlants(filteredPlants);
        }

        // On page load, display all plants
        displayPlants(plants);
    </script>
