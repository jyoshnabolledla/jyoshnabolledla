<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomHydrate 🌿💧</title>
  <link rel="stylesheet" href="time to water.css">
</head>
<body>
  <div class="app-container">
    <h1>Plant Watering Reminder</h1>
    
    <div class="plant-info">
      <label for="plant-name">Plant Name:</label>
      <input type="text" id="plant-name" placeholder="Enter your plant's name">
      
      <label for="watering-interval">Watering Interval (days):</label>
      <input type="number" id="watering-interval" placeholder="Enter interval in days">
      
      <button id="set-reminder">Set Watering Reminder</button>
    </div>
    
    <div class="status-container">
      <h2>Your Plant's Status</h2>
      <p id="last-watered">Last watered: Not watered yet</p>
      <p id="next-watering">Next watering in: N/A</p>
      <button id="water-plant" disabled>Water Now</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
